<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense - Student Expense Tracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <h1>Edit Expense</h1>

    {% if errors %}
        <div class="errors">
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST">

        <!-- Amount -->
        <label for="amount">Amount:</label><br>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            value="{{ expense['amount'] }}"
            required
        >

        <br><br>


        <!-- Category -->
        <label for="category">Category:</label><br>

        <input
            type="text"
            id="category"
            name="category"
            value="{{ expense['category'] }}"
            required
        >

        <br><br>


        <!-- Description -->
        <label for="description">Description:</label><br>

        <input
            type="text"
            id="description"
            name="description"
            value="{{ expense['description'] or '' }}"
        >

        <br><br>


        <!-- Date -->
        <label for="expense_date">Date:</label><br>

        <input
            type="date"
            id="expense_date"
            name="expense_date"
            value="{{ expense['expense_date'] }}"
            max="{{ today }}"
            required
        >

        <br><br>


        <!-- Payment Method -->
        <label for="payment_method">Payment Method:</label><br>

        <select
            id="payment_method"
            name="payment_method"
            required
        >

            <option
                value="Cash"
                {% if expense['payment_method'] == 'Cash' %}selected{% endif %}
            >
                Cash
            </option>

            <option
                value="UPI"
                {% if expense['payment_method'] == 'UPI' %}selected{% endif %}
            >
                UPI
            </option>

            <option
                value="Card"
                {% if expense['payment_method'] == 'Card' %}selected{% endif %}
            >
                Card
            </option>

            <option
                value="Other"
                {% if expense['payment_method'] == 'Other' %}selected{% endif %}
            >
                Other
            </option>

        </select>

        <br><br>


        <!-- Submit -->
        <button type="submit">
            Update Expense
        </button>

    </form>

    <br>

    <a href="{{ url_for('main.home') }}">
        Back to Expenses
    </a>

</body>
</html>
